name: Daily PostgreSQL Backup

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 Argentina
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create PostgreSQL backup (Docker Postgres 17)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/backups:/backups" \
            postgres:17 \
            pg_dump "$DATABASE_URL" > backups/backup-$(date +%Y-%m-%d).sql

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone (OAuth)
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_TOKEN
          EOF

      - name: Upload backup to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy backups gdrive: \
            --drive-root-folder-id $GDRIVE_FOLDER_ID

      - name: Cleanup
        run: rm -rf backups
